pool_size: 4
protocol:
  type: StepAndShoot
  steps: 60
  start_angle: 0.0
  end_angle: 3.141592653589793
  endpoint: false
  rotation_direction: CW
  time_per_step: 29999999999.999996
  initial_time: 0.0
  sequential_time: true
  radius: 258.75
  grid_variables: {}
  zipped_variables: {}
Materials:
- &air_2598 Air, Dry (near sea level)
- &glass_e941 Glass, Borosilicate (Pyrex)
- &pb_0789 Pb
- &sodium_iodide_a6c2 Sodium Iodide
- &water_6a66 Water, Liquid
simulation_manager:
  start_time: ${start_time}
  stop_time: ${stop_time}
  particles_number: 10000
  min_energy: 0.001
  physics_list: emstandard_opt4
data_manager:
