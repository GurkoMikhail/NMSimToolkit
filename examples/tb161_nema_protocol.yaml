pool_size: 24
logging:
  output_dir: "logs/tb161_nema"
  level: "INFO"
  console: false
  per_task_files: true
  filename_pattern: "task_{task_id}.log"
protocol:
  # 60 положений гантри для сбора 120 ракурсов при 2 противоположных детекторах (под 180°)
  # Шаг поворота гантри 3.0° (от 0.0° до 177.0° включительно при endpoint: false)
  type: StepAndShoot
  steps: 60
  start_angle: 0.0 deg
  end_angle: 180.0 deg
  endpoint: false
  rotation_direction: CW
  time_per_step: 30.0 s
  initial_time: 0.0 s
  sequential_time: true

scene:
  type: Volume
  name: Simulation_volume
  geometry:
    type: Box
    x: 120.0 cm
    y: 120.0 cm
    z: 80.0 cm
  material: 'Air, Dry (near sea level)'
  children:
    - type: WoodcockVoxelVolume
      name: Phantom
      voxel_size: 4.2 mm
      transformations:
        - type: rotate
          alpha: 90 deg
      distribution:
        format: raw
        path: phantoms/nema/anema_voxel_size_4.2_mm.dat
        shape: [128, 128, 92]
        order: 'F'
        mapping:
          0.04: 'Air, Dry (near sea level)'
          0.15: 'Water, Liquid'
      children:
        - type: Source
          name: Source
          radionuclide: '161Tb'
          phantom_type: 'NEMA IEC Body Phantom'
          radiation_type: Gamma
          activity: 100 MBq
          voxel_size: 4.2 mm
          half_life: 6.953 day
          # Эмиссионный спектр 161Tb (Juget et al., Appl. Radiat. Isot. 174, 2021 + Corrigendum 200, 2023;
          # линия 25.65 кэВ по ENSDF 2020; включены все линии с выходом > 0.003%)
          # Список пар: [энергия квантов с размерностью, интенсивность эмиссии на 100 распадов (%)]
          energy:
            # --- Низкоэнергетическая гамма-линия (ENSDF 2020) ---
            - [25.65 keV, 23.154]    # Гамма-линия 25.651 кэВ
            # --- Характеристическое рентгеновское излучение Dy (K-оболочка) ---
            - [45.21 keV, 7.747]     # X-ray Dy K_alpha2 (45.2083 кэВ)
            - [46.00 keV, 12.779]    # X-ray Dy K_alpha1 (45.999 кэВ)
            - [52.19 keV, 3.741]     # X-ray Dy K_beta1' (52.191 кэВ)
            - [53.64 keV, 1.0185]    # X-ray Dy K_beta2' (53.6353 кэВ)
            # --- Низкоэнергетические гамма-линии и главный фотопик ОФЭКТ ---
            - [48.92 keV, 17.73]     # Гамма-линия 48.915 кэВ (вторичное окно ОФЭКТ)
            - [57.19 keV, 2.066]     # Гамма-линия 57.192 кэВ
            - [59.24 keV, 0.2002]    # Гамма-линия 59.243 кэВ
            - [74.57 keV, 10.28]     # Главный гамма-пик ОФЭКТ (74.567 кэВ)
            - [77.42 keV, 0.0459]    # Гамма-линия 77.422 кэВ (внутри окна 74.6 кэВ)
            # --- Среднеэнергетические гамма-линии (вклад в комптоновский down-scatter) ---
            - [87.94 keV, 0.1996]    # Гамма-линия 87.941 кэВ
            - [103.07 keV, 0.1077]   # Гамма-линия 103.065 кэВ
            - [106.11 keV, 0.0816]   # Гамма-линия 106.113 кэВ
            # --- Высокоэнергетические гамма-линии (септальное проникновение в LEHR) ---
            - [286.48 keV, 0.01574]  # Гамма-линия 286.481 кэВ
            - [292.40 keV, 0.07102]  # Гамма-линия 292.401 кэВ
            - [319.66 keV, 0.00367]  # Гамма-линия 319.660 кэВ
            - [341.40 keV, 0.00375]  # Гамма-линия 341.400 кэВ
            - [343.63 keV, 0.01473]  # Гамма-линия 343.630 кэВ
            - [418.47 keV, 0.00925]  # Гамма-линия 418.470 кэВ
            - [475.66 keV, 0.01660]  # Гамма-линия 475.658 кэВ
            - [550.25 keV, 0.04258]  # Гамма-линия 550.249 кэВ
          distribution:
            format: raw
            path: phantoms/nema/nema_voxel_size_4.2_mm.dat
            shape: [128, 128, 92]
            order: 'F'

    - type: Gantry
      name: Gantry
      transformations:
        - type: rotate
          alpha: ${gantry_angle}
      children:
        # ---------------- ДЕТЕКТОРНАЯ ГОЛОВКА 1 (0°) ----------------
        - type: GammaCamera
          name: GammaCamera_1
          transformations:
            - type: rotate
              gamma: 90 deg
            - type: translate
              y: 329.05 mm
          slots:
            casing: Casing_1
            detector_box: Detector_box_1
            collimator: Collimator_1
            crystal: Detector_1
            glass_backend: Glass_backend_1
          children:
            - type: Volume
              name: Casing_1
              geometry:
                type: Box
                x: 58.0 cm
                y: 44.0 cm
                z: 14.06 cm
              material: 'Pb'
              children:
                - type: Volume
                  name: Detector_box_1
                  geometry:
                    type: Box
                    x: 54.0 cm
                    y: 40.0 cm
                    z: 12.06 cm
                  material: 'Air, Dry (near sea level)'
                  transformations:
                    - type: translate
                      z: 1.0 cm
                  children:
                    - type: DirectParallelCollimator
                      name: Collimator_1
                      size: [54.0 cm, 40.0 cm, 3.5 cm]
                      hole_diameter: 1.5 mm
                      septa: 0.2 mm
                      hole_shape: hexagonal
                      material: 'Pb'
                      transformations:
                        - type: translate
                          z: 4.28 cm
                    - type: Volume
                      name: Detector_1
                      geometry:
                        type: Box
                        x: 54.0 cm
                        y: 40.0 cm
                        z: 9.5 mm
                      material: 'Sodium Iodide'
                      transformations:
                        - type: translate
                          z: 2.045 cm
                    - type: Volume
                      name: Glass_backend_1
                      geometry:
                        type: Box
                        x: 54.0 cm
                        y: 40.0 cm
                        z: 7.6 cm
                      material: 'Glass, Borosilicate (Pyrex)'
                      transformations:
                        - type: translate
                          z: -2.23 cm

        # ---------------- ДЕТЕКТОРНАЯ ГОЛОВКА 2 (180°) ----------------
        - type: GammaCamera
          name: GammaCamera_2
          transformations:
            - type: rotate
              gamma: 90 deg
            - type: translate
              y: 329.05 mm
            - type: rotate
              alpha: 180.0 deg
          slots:
            casing: Casing_2
            detector_box: Detector_box_2
            collimator: Collimator_2
            crystal: Detector_2
            glass_backend: Glass_backend_2
          children:
            - type: Volume
              name: Casing_2
              geometry:
                type: Box
                x: 58.0 cm
                y: 44.0 cm
                z: 14.06 cm
              material: 'Pb'
              children:
                - type: Volume
                  name: Detector_box_2
                  geometry:
                    type: Box
                    x: 54.0 cm
                    y: 40.0 cm
                    z: 12.06 cm
                  material: 'Air, Dry (near sea level)'
                  transformations:
                    - type: translate
                      z: 1.0 cm
                  children:
                    - type: DirectParallelCollimator
                      name: Collimator_2
                      size: [54.0 cm, 40.0 cm, 3.5 cm]
                      hole_diameter: 1.5 mm
                      septa: 0.2 mm
                      hole_shape: hexagonal
                      material: 'Pb'
                      transformations:
                        - type: translate
                          z: 4.28 cm
                    - type: Volume
                      name: Detector_2
                      geometry:
                        type: Box
                        x: 54.0 cm
                        y: 40.0 cm
                        z: 9.5 mm
                      material: 'Sodium Iodide'
                      transformations:
                        - type: translate
                          z: 2.045 cm
                    - type: Volume
                      name: Glass_backend_2
                      geometry:
                        type: Box
                        x: 54.0 cm
                        y: 40.0 cm
                        z: 7.6 cm
                      material: 'Glass, Borosilicate (Pyrex)'
                      transformations:
                        - type: translate
                          z: -2.23 cm

data_manager:
  filename: "output_tb161_dual_cam/${gantry_angle deg}_deg.hdf"
  buffer_size: 3 MiB
  floating_point_precision: "float32"
  compression: "gzip"
  compression_opts: 4
  handlers:
    - type: HistoryAssemblerHandler
      sensitive_volumes:
        - Detector_1
        - Detector_2
      save_initial_states: true

simulation_manager:
  particles_number: 10000
  buffer_capacity: 100000
  min_energy: 1.0 keV
  physics_list: "emstandard_opt4"
